[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gan-game-theory"
version = "0.1.0"
description = "A game-theoretic study of GAN training stability and distance from equilibrium."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tqdm>=4.65.0",
    "scipy>=1.10.0",
    "Pillow>=9.5.0",
    "imageio>=2.31.0",
]

[project.scripts]
gan-train = "gan_game_theory.cli:train_main"
gan-grid = "gan_game_theory.cli:grid_main"
gan-plot = "gan_game_theory.cli:plot_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
